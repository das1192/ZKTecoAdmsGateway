<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZKTeco Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg: #0b0f1a;
            --surface: #111827;
            --surface2: #1a2233;
            --border: #1e2d45;
            --border2: #243550;
            --text: #e2e8f0;
            --muted: #64748b;
            --accent: #3b82f6;
            --accent-h: #2563eb;
            --green: #22c55e;
            --green-bg: #052e16;
            --green-b: #166534;
            --red: #ef4444;
            --red-bg: #1c0707;
            --red-b: #7f1d1d;
            --yellow: #f59e0b;
            --yellow-bg: #1c1200;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Header ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: grid;
            place-items: center;
        }

            .logo-icon svg {
                width: 18px;
                height: 18px;
            }

        .logo h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }

        .logo span {
            font-size: 12px;
            color: var(--muted);
            margin-left: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        /* ── Layout ── */
        .container {
            padding: 28px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── Stats Bar ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: border-color .2s;
        }

            .stat-card:hover {
                border-color: var(--border2);
            }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

            .stat-value.blue {
                color: var(--accent);
            }

            .stat-value.green {
                color: var(--green);
            }

            .stat-value.yellow {
                color: var(--yellow);
            }

        .stat-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ── Section ── */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-head {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .section-head h2 {
                font-size: 14px;
                font-weight: 600;
            }

            .section-head .actions {
                display: flex;
                gap: 8px;
            }

        /* ── Device Cards ── */
        .devices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }

        .device-card {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            transition: background .15s;
        }

            .device-card:last-child {
                border-bottom: none;
            }

            .device-card:hover {
                background: var(--surface2);
            }

        .device-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .device-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

            .device-icon svg {
                width: 20px;
                height: 20px;
                color: var(--accent);
            }

            .device-icon.offline svg {
                color: var(--muted);
            }

        .device-meta h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .device-meta .sn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }

        .device-meta .client-tag {
            display: inline-block;
            margin-left: 8px;
            background: #1e3a5f;
            color: #60a5fa;
            font-size: 11px;
            font-weight: 500;
            padding: 1px 7px;
            border-radius: 4px;
        }

        .device-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .device-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

            .device-stats span {
                display: flex;
                align-items: center;
                gap: 4px;
            }

        /* ── Badges ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

            .badge.online {
                background: var(--green-bg);
                color: var(--green);
                border: 1px solid var(--green-b);
            }

            .badge.offline {
                background: #1e1e1e;
                color: var(--muted);
                border: 1px solid #2a2a2a;
            }

            .badge.success {
                background: var(--green-bg);
                color: var(--green);
                border: 1px solid var(--green-b);
            }

            .badge.fail {
                background: var(--red-bg);
                color: var(--red);
                border: 1px solid var(--red-b);
            }

            .badge.pending {
                background: var(--yellow-bg);
                color: var(--yellow);
                border: 1px solid #78350f;
            }

        /* ── Toggle Switch ── */
        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-label {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            cursor: pointer;
        }

            .toggle input {
                opacity: 0;
                width: 0;
                height: 0;
            }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: #1e2d3d;
            border: 1px solid var(--border2);
            border-radius: 12px;
            transition: .2s;
        }

        .toggle input:checked + .toggle-track {
            background: #1a3d5c;
            border-color: var(--accent);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--muted);
            transition: .2s;
        }

        .toggle input:checked ~ .toggle-thumb {
            transform: translateX(20px);
            background: var(--accent);
        }

        .toggle.on .toggle-track {
            background: var(--green-bg);
            border-color: var(--green-b);
        }

        .toggle.on .toggle-thumb {
            background: var(--green);
        }

        /* ── Buttons ── */
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all .15s;
            white-space: nowrap;
        }

            .btn:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent-h);
        }

            .btn-primary:hover:not(:disabled) {
                background: var(--accent-h);
            }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border-color: var(--border2);
        }

            .btn-ghost:hover:not(:disabled) {
                background: var(--surface2);
                color: var(--text);
            }

        .btn-success {
            background: var(--green-bg);
            color: var(--green);
            border-color: var(--green-b);
        }

            .btn-success:hover:not(:disabled) {
                background: #064e1f;
            }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border-color: var(--red-b);
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        /* ── Activity Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 11px 24px;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }

        td {
            padding: 13px 24px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--surface2);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* ── Empty State ── */
        .empty {
            padding: 48px;
            text-align: center;
            color: var(--muted);
        }

            .empty svg {
                width: 40px;
                height: 40px;
                margin-bottom: 12px;
                opacity: .3;
            }

            .empty p {
                font-size: 14px;
            }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all .25s;
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 360px;
        }

            .toast.show {
                opacity: 1;
                transform: translateY(0);
            }

            .toast.ok {
                background: #052e16;
                color: var(--green);
                border: 1px solid var(--green-b);
            }

            .toast.err {
                background: var(--red-bg);
                color: var(--red);
                border: 1px solid var(--red-b);
            }

        /* ── Spinner ── */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spin {
            animation: spin .7s linear infinite;
            display: inline-block;
        }

        /* ── Pull pending shimmer ── */
        .pending-row {
            animation: shimmer 1.5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: .6
            }
        }

        /* ── Auto badge ── */
        .auto-on {
            color: var(--green);
            font-size: 11px;
            font-weight: 600;
        }

        .auto-off {
            color: var(--muted);
            font-size: 11px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
            </div>
            <h1>ZKTeco Gateway <span>Control Panel</span></h1>
        </div>
        <div class="header-right">
            <div class="clock" id="clock">—</div>
            <div class="status-dot" id="statusDot" title="Gateway online"></div>
        </div>
    </header>

    <div class="container">

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Devices</div>
                <div class="stat-value blue" id="statTotal">—</div>
                <div class="stat-sub">Configured</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Online Now</div>
                <div class="stat-value green" id="statOnline">—</div>
                <div class="stat-sub">Active connection</div>
            </div>
            <!--<div class="stat-card">
                <div class="stat-label">Auto-Pull Active</div>
                <div class="stat-value yellow" id="statAuto">—</div>
                <div class="stat-sub">Devices on auto mode</div>
            </div>-->
            <div class="stat-card">
                <div class="stat-label">Records Today</div>
                <div class="stat-value" id="statRecords">—</div>
                <div class="stat-sub">Forwarded successfully</div>
            </div>
        </div>

        <!-- Devices -->
        <div class="section">
            <div class="section-head">
                <h2>Devices</h2>
                <div class="actions">
                    <button class="btn btn-success btn-sm" onclick="pullAll()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Pull All Online
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="load()">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M23 4v6h-6M1 20v-6h6" />
                            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>
            <div class="devices-grid" id="devicesGrid">
                <div class="empty"><p>Loading devices...</p></div>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="section">
            <div class="section-head">
                <h2>Recent Activity</h2>
                <span style="font-size:12px;color:var(--muted)">Last 30 events — auto-refreshes every 10s</span>
            </div>
            <div id="activityWrap">
                <div class="empty"><p>Loading activity...</p></div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>const KEY = () => sessionStorage.getItem('ak') || promptKey();
function promptKey() {
  const k = prompt('Admin Key:') || '';
  if (k) sessionStorage.setItem('ak', k);
  return k;
}
const H = () => ({'X-Admin-Key': KEY()});

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 3500);
}

function timeAgo(dt) {
  if (!dt) return 'Never';
  const s = Math.floor((Date.now() - new Date(dt)) / 1000);
  if (s < 5)  return 'Just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return new Date(dt).toLocaleDateString();
}

function fmtTime(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// ── Toggle auto-pull ───────────────────────────────────────────────────────
async function toggleAuto(sn, enable) {
  try {
    const r = await fetch(`/api/auto/${sn}/${enable ? 'on' : 'off'}`, {method:'POST', headers: H()});
    const d = await r.json();
    toast(d.message, d.success);
    setTimeout(load, 500);
  } catch(e) { toast('Request failed', false); }
}

// ── Manual pull ────────────────────────────────────────────────────────────
async function pull(sn, btn) {
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spin">↻</span> Pulling...';
  try {
    const r = await fetch(`/api/pull/${sn}`, {method:'POST', headers: H()});
    const d = await r.json();
    toast(d.message, d.success);
    if (d.success) setTimeout(load, 4000);
  } catch(e) { toast('Request failed', false); }
  setTimeout(() => { btn.disabled = false; btn.innerHTML = orig; }, 3000);
}

// ── Pull all ────────────────────────────────────────────────────────────────
async function pullAll() {
  try {
    const r = await fetch('/api/pull-all', {method:'POST', headers: H()});
    const d = await r.json();
    toast(d.message, d.success);
    setTimeout(load, 4000);
  } catch(e) { toast('Request failed', false); }
}

// ── Render devices ─────────────────────────────────────────────────────────
function renderDevices(devices) {
  const g = document.getElementById('devicesGrid');
  if (!devices.length) {
    g.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      <p>No devices configured in appsettings.json</p>
    </div>`;
    return;
  }

  g.innerHTML = devices.map(d => {
    const online = d.isOnline;
    const lastPull = d.recentPulls?.[0];
    const stamp = d.lastStamp > 0 ? `Stamp #${d.lastStamp}` : 'No data yet';

    return `
    <div class="device-card ${d.pullPending ? 'pending-row' : ''}">
      <div>
        <div class="device-info">
          <div class="device-icon ${online ? '' : 'offline'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </div>
          <div class="device-meta">
            <h3>
              ${d.clientName}
              <span class="client-tag">${d.clientId}</span>
            </h3>
            <div class="sn">${d.serialNumber}</div>
          </div>
        </div>
        <div class="device-stats">
          <span>
            <span class="badge ${online ? 'online' : 'offline'}">
              ${online ? '● Online' : '○ Offline'}
            </span>
          </span>
          <span>Last seen: ${timeAgo(d.lastSeen)}</span>
          <span>${stamp}</span>
          ${d.pullPending ? '<span class="badge pending">⏳ Pull pending...</span>' : ''}
          ${lastPull ? `<span class="${lastPull.success ? 'auto-on' : ''}">${lastPull.success ? '✓' : '✗'} ${lastPull.recordCount} records ${timeAgo(lastPull.time)}</span>` : ''}
        </div>
      </div>

      <div class="device-controls">
        <!-- Auto Pull Toggle -->
        <div class="toggle-wrap">
          <span class="toggle-label">Auto</span>
          <label class="toggle ${d.autoPull ? 'on' : ''}">
            <input  type="checkbox" ${d.autoPull ? 'checked' : ''}
              onchange="toggleAuto('${d.serialNumber}', this.checked)">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
          <span class="${d.autoPull ? 'auto-on' : 'auto-off'}">${d.autoPull ? 'ON' : 'OFF'}</span>
        </div>

        <!-- Manual Pull -->
        <button class="btn btn-primary btn-sm"
          onclick="pull('${d.serialNumber}', this)"
          ${!online ? 'disabled title="Device offline"' : ''}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
            <path d="M20 21H4"/>
          </svg>
          Pull Now
        </button>
      </div>
    </div>`;
  }).join('');
}

// ── Render activity ────────────────────────────────────────────────────────
function renderActivity(logs) {
  const w = document.getElementById('activityWrap');
  if (!logs.length) {
    w.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>No activity yet — pull data from a device to see results here</p>
    </div>`;
    return;
  }

  w.innerHTML = `<table>
    <thead><tr>
      <th>Time</th>
      <th>Device</th>
      <th>Client</th>
      <th>Records</th>
      <th>Result</th>
      <th>Detail</th>
    </tr></thead>
    <tbody>
    ${logs.map(l => `
      <tr>
        <td class="mono">${fmtTime(l.time)}</td>
        <td class="mono">${l.serialNumber}</td>
        <td>${l.serialNumber}</td>
        <td style="font-weight:600;color:${l.recordCount > 0 ? 'var(--text)' : 'var(--muted)'}">${l.recordCount}</td>
        <td><span class="badge ${l.success ? 'success' : 'fail'}">${l.success ? '✓ OK' : '✗ Failed'}</span></td>
        <td class="mono" style="color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${l.message}">${l.message}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// ── Main load ──────────────────────────────────────────────────────────────
let todayRecords = 0;

async function load() {
  try {
    const r = await fetch('/api/status', {headers: H()});
    if (r.status === 401) { sessionStorage.removeItem('ak'); toast('Wrong admin key', false); return; }
    const data = await r.json();

    document.getElementById('statTotal').textContent   = data.totalDevices ?? '—';
    document.getElementById('statOnline').textContent  = data.onlineDevices ?? '—';

    //const autoCount = (data.devices ?? []).filter(d => d.autoPull).length;
    //document.getElementById('statAuto').textContent = autoCount;

    // Tally today's records from activity
    const today = new Date().toDateString();
    todayRecords = (data.recentActivity ?? [])
      .filter(l => l.success && new Date(l.time).toDateString() === today)
      .reduce((s, l) => s + l.recordCount, 0);
    document.getElementById('statRecords').textContent = todayRecords.toLocaleString();

    renderDevices(data.devices ?? []);
    renderActivity(data.recentActivity ?? []);

    document.getElementById('statusDot').style.background = 'var(--green)';
  } catch(e) {
    document.getElementById('statusDot').style.background = 'var(--red)';
    console.error(e);
  }
}

// ── Clock ──────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}, 1000);

// Auto-refresh every 10s
load();
setInterval(load, 10000);</script>
